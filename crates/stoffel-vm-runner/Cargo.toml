[package]
name = "stoffel-vm-runner"
version = "0.1.1"
edition = "2021"
description = "Local runner and CLI binary for executing Stoffel VM programs"
license = "Apache-2.0"
repository = "https://github.com/Stoffel-Labs/stoffel"
homepage = "https://stoffelmpc.com"
keywords = ["mpc", "vm", "runner", "cryptography"]
categories = ["command-line-utilities", "cryptography"]
publish = true

[[bin]]
name = "stoffel-run"
path = "src/bin/stoffel-run.rs"

# Captures a node image's TDX attestation measurement from a running dstack CVM,
# for pinning as STOFFEL_ATTESTATION_ALLOWED_MEASUREMENTS. Only meaningful under
# the attestation-dstack feature (prints a clear error otherwise).
[[bin]]
name = "stoffel-dstack-measurement"
path = "src/bin/stoffel-dstack-measurement.rs"

[dependencies]
stoffel-vm = { version = "0.1.1", path = "../stoffel-vm" }
stoffel-vm-types = { version = "0.1.1", path = "../stoffel-vm-types" }
stoffel-mpc-coordinator-shared = "0.1.0"
stoffel-mpc-coordinator-off-chain = "0.1.0"
stoffelmpc-mpc = { package = "stoffelcrypto", version = "0.1.0" }
stoffelnet = "0.1.0"
ark-bls12-381 = "0.5.0"
ark-bn254 = "0.5.0"
ark-curve25519 = "0.5.0"
ark-ed25519 = "0.5.0"
ark-secp256k1 = "0.5.0"
ark-secp256r1 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["getrandom"] }
async-trait = "0.1"
bincode = { version = "1.3.3", default-features = true }
futures = "0.3.31"
hex = "0.4"
libc = "0.2"
rustls = "0.23"
serde = { version = "1.0", features = ["derive", "default"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4"] }
x509-parser = "0.18.1"

[features]
# Forward to the VM crate so the dstack node image can be built with
# `--features attestation-dstack` (real Intel TDX quote verification).
# When OFF, requesting STOFFEL_ATTESTATION_MODE=dstack at runtime is a hard
# error (the node exits rather than register without evidence).
attestation-dstack = ["stoffel-vm/attestation-dstack"]

[dev-dependencies]
stoffel-vm-types = { version = "0.1.1", path = "../stoffel-vm-types" }
stoffellang = { version = "0.1.1", path = "../stoffel-lang" }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
